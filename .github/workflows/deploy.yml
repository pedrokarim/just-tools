# .github/workflows/deploy.yml – construit l'image et la pousse sur GHCR.
#
# `main` → étiquettes `main` et `<sha>`.
#
# Le déploiement lui-même reste manuel au début (`./deploy.sh` sur le serveur).
# Pour l'automatiser plus tard : une étape SSH avec une clé dédiée, restreinte
# dans `authorized_keys` à la seule commande `deploy.sh`.
#
# Variables de dépôt à créer (Settings → Secrets and variables → Actions →
# Variables, pas Secrets : elles finissent dans le JavaScript public) :
#   NEXT_PUBLIC_SITE_NAME, NEXT_PUBLIC_SITE_DESCRIPTION, NEXT_PUBLIC_SITE_URL,
#   NEXT_PUBLIC_FALLBACK_URL, NEXT_PUBLIC_CONTACT_EMAIL,
#   NEXT_PUBLIC_ASCENCIA_ISSUER, NEXT_PUBLIC_SARUTOBI_SITE_ID

name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pedrokarim/just-tools:${{ github.ref_name }}
            ghcr.io/pedrokarim/just-tools:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_SITE_DESCRIPTION=${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_FALLBACK_URL=${{ vars.NEXT_PUBLIC_FALLBACK_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_ASCENCIA_ISSUER=${{ vars.NEXT_PUBLIC_ASCENCIA_ISSUER }}
            NEXT_PUBLIC_SARUTOBI_SITE_ID=${{ vars.NEXT_PUBLIC_SARUTOBI_SITE_ID }}
            GITHUB_SHA=${{ github.sha }}
          # Cache des couches entre deux builds (dépendances surtout).
          cache-from: type=gha
          cache-to: type=gha,mode=max
