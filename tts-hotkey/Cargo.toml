[package]
name = "tts-hotkey"
version = "0.1.0"
edition = "2024"
description = "Raccourci clavier global qui envoie le presse-papiers vers la synthèse vocale de Just Tools"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
clipboard-win = "5.4.1"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
tray-icon = "0.24.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winreg = "0.56.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
